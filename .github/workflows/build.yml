name: Build

on:
  push:
    branches:
      - main
      - dev
      - feature/*
    paths:
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/**
  workflow_dispatch:

env:
  WORKING_DIRECTORY: ./

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Build Angular app
        run: npm run build
        working-directory: ${{ env.WORKING_DIRECTORY }}

      # Step 5: Upload Build Artifacts
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: dist/ # Adjust if your build output is different
          retention-days: 7
