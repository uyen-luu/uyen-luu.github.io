name: Angular Build ul-portfolio

on:
  push:
    branches:
      - main
      - dev
      - feature/*
    paths:
      - src/**
      - package.json
      - package-lock.json
  workflow_dispatch:

env:
  WORKING_DIRECTORY: ./

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Use the desired Node.js version
          registry-url: 'https://registry.npmjs.org'

      # Step 3: Install dependencies
      - name: Install dependencies for ul-portfolio
        run: npm install
        working-directory: ${{ env.WORKING_DIRECTORY }}

      # Step 4: Build the Angular app
      - name: Build Angular app
        run: npm run build -- --configuration production # Adjust configuration as needed
        working-directory: ${{ env.WORKING_DIRECTORY }}