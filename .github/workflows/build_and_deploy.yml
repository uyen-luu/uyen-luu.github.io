name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      trigger_build:
        description: "Build?"
        required: true
        default: true # Default is true, meaning build job will run unless explicitly set to false
        type: boolean

      trigger_deploy:
        description: "Deploy?"
        required: true
        default: false # Default is true, meaning deploy job will run unless explicitly set to false
        type: boolean

  push:
    branches:
      - main
      - dev
      - feature/*
    paths:
      - src/**
      - package.json
      - package-lock.json
      - angular.json
      - tsconfig*.json
      - eslint.config.js
      - vitest.config.ts
      - postcss.config.json
      - playwright.config.ts
      - e2e/**
      - .github/workflows/**
      - .github/actions/**

  # Daily check that the live site and its external links (resume, socials) still work.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  # Keep the scheduled check in its own group so it never cancels (or is cancelled by) a deploy.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'build' }}
  cancel-in-progress: true

env:
  OUTPUT_PATH: dist/ul-portfolio/browser

jobs:
  build:
    if: >
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.trigger_build == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run lint
        id: lint
        run: npm run lint

      - name: Run tests
        id: test
        run: npm test

      - name: Build Angular app
        id: build
        run: npm run build

      # Lets verify-live wait until GitHub Pages actually serves this commit.
      - name: Write build marker
        run: |
          sed -i 's|</head>|<meta name="build" content="${{ github.sha }}"></head>|' ${{ env.OUTPUT_PATH }}/index.html
          grep -q '<meta name="build" content="${{ github.sha }}">' ${{ env.OUTPUT_PATH }}/index.html

      - name: Clone index.html to 404.html for Angular 17+
        id: copy
        run: |
          cp ${{ env.OUTPUT_PATH }}/index.html ${{ env.OUTPUT_PATH }}/404.html
          echo -e "\033[0;32mSuccessfully cloned index.html to 404.html\033[0m"

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run e2e tests against the build
        id: e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-build
          path: playwright-report/
          retention-days: 14

      - name: Upload build artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.OUTPUT_PATH }}

  deploy:
    if: >
      github.event_name != 'schedule' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_deploy == 'true') ||
      (github.ref == 'refs/heads/main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Ensures deploy happens only after the build

    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    # Runs after every successful deploy (so under the same conditions as deploy), and on the daily schedule.
    # !cancelled() lets the scheduled run start even though build and deploy are skipped.
    if: >
      !cancelled() &&
      (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run smoke tests against the live site
        id: e2e
        run: npm run e2e:live
        env:
          E2E_BASE_URL: https://uyen-luu.github.io
          # Scheduled runs check whatever is live, so they don't wait for a specific build.
          E2E_EXPECTED_SHA: ${{ github.event_name != 'schedule' && github.sha || '' }}

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 14
