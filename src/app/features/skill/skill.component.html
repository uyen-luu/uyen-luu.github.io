<div id="skills" class="relative z-50 border-t my-12 lg:my-24 border-[#25213b]">
  <div
    class="w-[100px] h-[100px] bg-violet-100 rounded-full absolute top-6 left-[42%] translate-x-1/2 filter blur-3xl opacity-20"
  ></div>
  <div class="flex justify-center -translate-y-[1px]">
    <div class="w-3/4">
      <div
        class="h-[1px] bg-gradient-to-r from-transparent via-violet-500 to-transparent w-full"
      ></div>
    </div>
  </div>
  <div class="flex justify-center my-5 lg:py-8">
    <div class="flex items-center">
      <span class="w-24 h-[2px] bg-[#1a1443]"></span
      ><span class="bg-[#1a1443] w-fit text-white p-2 px-5 text-xl rounded-md"
        >Skills</span
      ><span class="w-24 h-[2px] bg-[#1a1443]"></span>
    </div>
  </div>
  <div class="w-full my-12">
    <div
      class="rfm-marquee-container"
      style="
        --pause-on-hover: paused;
        --pause-on-click: paused;
        --width: 100%;
        --transform: none;
      "
    >
      <div
        class="rfm-marquee"
        style="
          --play: running;
          --direction: normal;
          --duration: 46.0865234375s;
          --delay: 0s;
          --iteration-count: infinite;
          --min-width: 100%;
        "
        [ngStyle]="{ '--duration': duration + 's' }"
      >
        <div
          *ngFor="let item of skills"
          class="rfm-child"
          style="--transform: none"
        >
          <div
            class="w-36 min-w-fit h-fit flex flex-col items-center justify-center transition-all duration-500 m-3 sm:m-5 rounded-lg group relative hover:scale-[1.15] cursor-pointer"
          >
            <div
              class="h-full w-full rounded-lg border border-[#1f223c] bg-[#11152c] shadow-none shadow-gray-50 group-hover:border-violet-500 transition-all duration-500"
            >
              <div class="flex -translate-y-[1px] justify-center">
                <div class="w-3/4">
                  <div
                    class="h-[1px] w-full bg-gradient-to-r from-transparent via-violet-500 to-transparent"
                  ></div>
                </div>
              </div>
              <div class="flex flex-col items-center justify-center gap-3 p-6">
                <div class="h-8 sm:h-10">
                  <img
                    alt="HTML"
                    loading="lazy"
                    width="40"
                    height="40"
                    decoding="async"
                    data-nimg="1"
                    class="h-full w-auto rounded-lg"
                    [src]="item.imagePath"
                    style="color: transparent"
                  />
                </div>
                <p class="text-white text-sm sm:text-lg">{{ item.name }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
