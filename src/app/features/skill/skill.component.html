<div class="relative z-50">
  <div
    class="w-[100px] h-[100px] bg-violet-100 rounded-full absolute top-6 left-[42%] translate-x-1/2 filter blur-3xl opacity-20"
  ></div>
  <div class="flex justify-center -translate-y-[1px]">
    <div class="w-3/4">
      <div
        class="h-[1px] bg-gradient-to-r from-transparent via-violet-500 to-transparent w-full"
      ></div>
    </div>
  </div>
  <div class="flex justify-center my-5 lg:py-8">
    <div class="flex items-center">
      <span class="w-24 h-[2px] bg-[#1a1443]"></span
      ><span class="bg-[#1a1443] w-fit text-white p-2 px-5 text-xl rounded-md"
        >Skills</span
      ><span class="w-24 h-[2px] bg-[#1a1443]"></span>
    </div>
  </div>
  <div class="w-full my-12">
    @for (item of items; track $index) {
    <div class="mb-8">
      <!-- Category header -->
      <h2 class="text-xl font-semibold text-gray-800 mb-4">{{ item[0] }}</h2>

      <!-- Skills grid -->
      <div
        class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-6 2xl:grid-cols-8 gap-4"
      >
        @for (skill of item[1]; track $index) {
        <app-skill-item [item]="skill"></app-skill-item>
        }
      </div>
    </div>
    }
  </div>
</div>
