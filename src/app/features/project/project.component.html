<div id="projects" class="relative z-50 my-12 lg:my-24">
  <div class="sticky top-10">
    <div
      class="w-[80px] h-[80px] bg-violet-100 rounded-full absolute -top-3 left-0 translate-x-1/2 filter blur-3xl opacity-30"
    ></div>
    <div class="flex items-center justify-start relative">
      <span
        class="bg-[#1a1443] absolute left-0 w-fit text-white px-5 py-3 text-xl rounded-md"
        >PROJECTS</span
      ><span class="w-full h-[2px] bg-[#1a1443]"></span>
    </div>
  </div>
  <div class="pt-24">
    <div class="flex flex-col gap-6">
      <div
        *ngFor="let project of projects; let i = index"
        [id]="'sticky-card-' + (i + 1).toString()"
        class="sticky-card w-full mx-auto max-w-2xl sticky"
      >
        <div
          class="box-border flex items-center justify-center rounded shadow-[0_0_30px_0_rgba(0,0,0,0.3)] transition-all duration-[0.5s]"
        >
          <div
            class="from-[#0d1224] border-[#1b2c68a0] relative rounded-lg border bg-gradient-to-r to-[#0a0d37] w-full"
          >
            <div class="flex flex-row">
              <div
                class="h-[1px] w-full bg-gradient-to-r from-transparent via-pink-500 to-violet-600"
              ></div>
              <div
                class="h-[1px] w-full bg-gradient-to-r from-violet-600 to-transparent"
              ></div>
            </div>
            <div class="px-4 lg:px-8 py-3 lg:py-5 relative">
              <div
                class="flex flex-row space-x-1 lg:space-x-2 absolute top-1/2 -translate-y-1/2"
              >
                <div
                  class="h-2 w-2 lg:h-3 lg:w-3 rounded-full bg-red-400"
                ></div>
                <div
                  class="h-2 w-2 lg:h-3 lg:w-3 rounded-full bg-orange-400"
                ></div>
                <div
                  class="h-2 w-2 lg:h-3 lg:w-3 rounded-full bg-green-200"
                ></div>
              </div>
              <p class="text-center ml-3 text-[#16f2b3] text-base lg:text-xl">
                {{ project.name }}
              </p>
            </div>
            <div
              class="overflow-hidden border-t-[2px] border-indigo-900 px-4 lg:px-8 py-4 lg:py-8"
            >
              <code class="font-mono text-xs md:text-sm lg:text-base"
                ><div class="blink">
                  <span class="mr-2 text-pink-500">const</span
                  ><span class="mr-2 text-white">project</span
                  ><span class="mr-2 text-pink-500">=</span
                  ><span class="text-gray-400">&#123;</span>
                </div>
                <div>
                  <span class="ml-4 lg:ml-8 mr-2 text-white">name:</span
                  ><span class="text-gray-400">'</span
                  ><span class="text-amber-300">{{ project.name }}</span
                  ><span class="text-gray-400">',</span>
                </div>
                <div class="ml-4 lg:ml-8 mr-2">
                  <span class="text-white">tools:</span
                  ><span class="text-gray-400"> ['</span>
                  <ng-container *ngFor="let tool of project.tools">
                    <span class="text-amber-300">{{ tool }}</span
                    ><span class="text-gray-400">', '</span>
                  </ng-container>
                  ><span class="text-gray-400">],</span>
                </div>
                <div>
                  <span class="ml-4 lg:ml-8 mr-2 text-white">myRole:</span
                  ><span class="text-orange-400">{{ project.role }}</span
                  ><span class="text-gray-400">,</span>
                </div>
                <div class="ml-4 lg:ml-8 mr-2">
                  <span class="text-white">Description:</span
                  ><span class="text-cyan-400"> {{ project.description }}</span
                  ><span class="text-gray-400">,</span>
                </div>
                <div><span class="text-gray-400">&#125;;</span></div></code
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
