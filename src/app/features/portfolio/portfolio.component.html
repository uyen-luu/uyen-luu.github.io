<mat-accordion>
  @for (project of projects; track $index) {
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title> {{ project.name }} </mat-panel-title>
        @if (project.startDate && project.endDate) {
          <mat-panel-description
            >{{ project.startDate }} - {{ project.endDate }}
          </mat-panel-description>
        }
      </mat-expansion-panel-header>
      {{ project.description }}
    </mat-expansion-panel>
  }
</mat-accordion>
