<div
  class="order-1 lg:order-2 from-[#0d1224] border-[#1b2c68a0] relative rounded-lg border bg-gradient-to-r to-[#0a0d37]"
>
  <div class="flex flex-row">
    <div
      class="h-[1px] w-full bg-gradient-to-r from-transparent via-pink-500 to-violet-600"
    ></div>
    <div
      class="h-[1px] w-full bg-gradient-to-r from-violet-600 to-transparent"
    ></div>
  </div>
  <div class="px-4 lg:px-8 py-3 lg:py-5 relative">
    <div
      class="flex flex-row space-x-1 lg:space-x-2 absolute top-1/2 -translate-y-1/2"
    >
      <div class="h-2 w-2 lg:h-3 lg:w-3 rounded-full bg-red-400"></div>
      <div class="h-2 w-2 lg:h-3 lg:w-3 rounded-full bg-orange-400"></div>
      <div class="h-2 w-2 lg:h-3 lg:w-3 rounded-full bg-green-200"></div>
    </div>
    <p
      *ngIf="!!title"
      class="text-center ml-3 text-[#16f2b3] text-base lg:text-xl"
    >
      {{ title }}
    </p>
  </div>
  <div
    class="overflow-hidden border-t-[2px] border-indigo-900 px-4 lg:px-8 py-4 lg:py-8"
  >
    <ng-content></ng-content>
  </div>
</div>
